<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>台灣妖怪抓抓樂</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            font-family: 'Segoe UI', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            width: 100%;
            max-width: 550px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 56px;
            backdrop-filter: blur(4px);
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
            overflow: hidden;
            padding: 16px 12px 20px;
        }

        .status-bar {
            background: #2c1a0ecc;
            border-radius: 60px;
            padding: 12px 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            color: #ffefcf;
            text-shadow: 0 1px 2px black;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }
        .catch-count {
            background: #f7b05e;
            color: #2d2b1f;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 1.2rem;
        }

        /* 遊戲場地 (妖怪出現區) */
        .game-area {
            background: #6f8f5faa;
            background-image: radial-gradient(circle at 25% 40%, rgba(180,210,140,0.3) 2%, transparent 2.5%);
            background-size: 32px 32px;
            min-height: 380px;
            border-radius: 48px;
            position: relative;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px #ecd9b4, inset 0 0 0 8px #8b6946, 0 8px 20px black;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* 妖怪按鈕樣式 */
        .monster-btn {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #fff2df;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 0 #7a4d2e;
            cursor: pointer;
            transition: transform 0.05s linear, box-shadow 0.1s;
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: #3b2a1f;
            border: none;
            touch-action: manipulation;
            will-change: transform;
        }
        .monster-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #7a4d2e;
        }
        .monster-name {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 2px 8px;
            border-radius: 30px;
            margin-top: 4px;
            font-weight: normal;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 10px;
        }
        .btn {
            background: #fbd26a;
            border: none;
            padding: 12px 0;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 60px;
            width: 30%;
            box-shadow: 0 5px 0 #a05e15;
            transition: 0.05s linear;
            text-align: center;
            color: #2f2418;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #a05e15;
        }

        /* 圖鑑浮層 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: #fff9ef;
            width: 85%;
            max-width: 450px;
            max-height: 80vh;
            border-radius: 48px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 20px 40px black;
            border: 2px solid #ffcf8a;
        }
        .modal-card h2 {
            text-align: center;
            color: #4f2d1a;
            margin-top: 0;
        }
        /* 圖鑑網格 */
        .pokedex-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 16px;
            margin: 20px 0;
            max-height: 60vh;
            overflow-y: auto;
            padding: 8px;
        }
        .pokedex-card {
            background: #fdf8ed;
            border-radius: 24px;
            box-shadow: 0 6px 0 #b98f5c;
            text-align: center;
            padding: 12px 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            border: 2px solid #ebc28e;
        }
        .pokedex-card:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #b98f5c;
        }
        .pokedex-avatar {
            width: 70px;
            height: 70px;
            margin: 0 auto 8px;
            background: #e6d5b3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .pokedex-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .pokedex-card.uncaught {
            opacity: 0.6;
            filter: grayscale(0.3);
            background: #cbbd9a;
            border-color: #8e6a3e;
        }
        .pokedex-card.uncaught .pokedex-avatar {
            background: #ab8e64;
        }
        .question-mark {
            font-size: 2.5rem;
            font-weight: bold;
            color: #5e3a1f;
        }
        .pokedex-name {
            font-size: 0.85rem;
            font-weight: bold;
            color: #3b2a1f;
            margin-top: 5px;
            white-space: nowrap;
            overflow-x: auto;
        }
        .close-modal {
            background: #ac7349;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 12px;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #e9dbbc;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="status-bar">
        <span>📖 台灣妖怪大師</span>
        <span class="catch-count">🐾 捕獲: <span id="catchNumber">0</span></span>
    </div>
    <div id="gameArea" class="game-area"></div>
    <div class="action-buttons">
        <button class="btn" id="openPokedexBtn">📕 圖鑑</button>
        <button class="btn" id="resetBtn">🔄 重置</button>
        <button class="btn" id="igBtn">📷 IG</button>
    </div>
    <footer>✨ 妖怪會隨機出現 → 點擊捕捉！</footer>
</div>

<!-- 圖鑑彈窗 -->
<div id="pokedexModal" class="modal">
    <div class="modal-card">
        <h2>✨ 台灣妖怪圖鑑 ✨</h2>
        <div id="pokedexList" class="pokedex-list">載入中...</div>
        <button class="close-modal" id="closeModalBtn">關閉圖鑑</button>
    </div>
</div>

<script>
    // ---------- 台灣妖怪資料庫 (20隻，ID皆為純數字字串) ----------
    const MONSTERS = [
        { id: "1", name: "紅衣小女孩", emoji: "👻", desc: "台灣最知名的都市傳說與鄉野妖怪之一，通常被描述為一個身穿紅色童裝的小女孩，會突然出現在山區或監視器畫面中，被認為是山精鬼魅或「魔神仔」的一種。" },
        { id: "2", name: "人面魚", emoji: "🐟", desc: "最早源於1990年代一則口耳相傳的靈異故事，描述一名釣客捕獲的吳郭魚身上浮現老婦人臉孔，並以台語說出「魚肉好吃嗎」等話語。" },
        { id: "3", name: "油蹄貓", emoji: "🐱", desc: "油蹄貓會一種特殊的魔法，當牠跳躍過死者的身體時，死者會起死回生。" },
        { id: "4", name: "山藥怪人", emoji: "👹", desc: "擁有一對翅膀會飛翔的神奇山藥，怕被吃掉。" },
        { id: "5", name: "婆娑鳥", emoji: "🦜", desc: "公鳥華麗，母鳥素雅。他們是森林中的歌姬，有讓所有動物為之稱服的甜美歌聲。" },
        { id: "6", name: "貓鬼", emoji: "🐈", desc: "貪吃鬼小貓咪，看到小孩肥美的臉頰走不動路，直到品嘗到麻油雞。" },
        { id: "7", name: "鹿兔", emoji: "🐰", desc: "從前兔子的頭上都有長角，直到鹿將兔角借走，兔兔的頭上再也不長角了。" },
        { id: "8", name: "兩腳魚", emoji: "🐠", desc: "因為太勤奮把報恩對象養成小廢物的肌肉猛魚。" },
        { id: "9", name: "西瓜鬼", emoji: "🍉", desc: "西瓜鬼，是台灣傳說中的鬼怪，會變成西瓜以捉弄他人。" },
        { id: "10", name: "鯰魚精", emoji: "🐋", desc: "覺得池子太小，招雨導致淹大水滅村，最後被三山國王嚴懲。" },
        { id: "11", name: "貍女", emoji: "🦡", desc: "會變成美少女害男村民忘記回家的小果子狸。" },
        { id: "12", name: "白犬", emoji: "🐶", desc: "達魯瑪克的守護獸，當部落搬家時，白犬不肯一直汪汪叫，結果部落村民因為瘧疾去世，之後族人將白犬叫的地方稱作「達洛卡可屯」。" },
        { id: "13", name: "虎姑婆", emoji: "🐯", desc: "山中的老虎精化身為老婆婆，誘騙小孩開門，據說最怕熱水澡。" },
        { id: "14", name: "雲龍", emoji: "🌪️", desc: "在台灣南方的傀儡山上，住著一條墨黑色的雲龍。牠最愛在雲層間穿梭，只要牠一出現，就會帶來大雨。" },
        { id: "15", name: "宮燈姊姊", emoji: "👧", desc: "淡江大學校園內著名的女鬼傳說，相傳她穿著日治時期或復古學生制服，常在夜間提著宮燈現身於校園的宮燈道上，等待或詢問男學生「幾點了」。" },
        { id: "16", name: "大明蛇神", emoji: "🐍", desc: "台灣台北市北投不動明王寺旁的瀑布兩側所供奉的「大蛇明神」，傳說源自日治時期危害地方的蛇妖被不動明王鎮伏後昇格為神明。" },
        { id: "17", name: "幽靈巴士", emoji: "🚐", desc: "陽明山的仰德大道上有一台半夜還在載人的260公車，傳說那是給好兄弟坐的公車。" },
        { id: "18", name: "雪山魔女", emoji: "🟣", desc: "據說在雪山山上有個女鬼會把登山的人誘導進深山山林裡失蹤，通常出現在雪山的黑森林中。" },
        { id: "19", name: "陳守娘", emoji: "👩‍🦰", desc: "台灣最強女鬼，生前被欺負，死後化做怨靈因靈力太強導致台南大亂，土地公來勸她，被她趕跑。連廣澤尊王來了，紅光和青光在天上打了很久，最終被菩薩感化。" },
        { id: "20", name: "大腳仙", emoji: "👟", desc: "屏東縣潮州鎮大腳仙林以其命名，後來傳說變成有一雙大腳的巨人許大砲。" }
    ];

    // ---------- 遊戲狀態 ----------
    let caughtSet = new Set();
    let currentMonsters = [];
    let spawnInterval = null;

    // DOM 元素
    const gameArea = document.getElementById("gameArea");
    const catchNumberSpan = document.getElementById("catchNumber");
    const openPokedexBtn = document.getElementById("openPokedexBtn");
    const resetBtn = document.getElementById("resetBtn");
    const igBtn = document.getElementById("igBtn");
    const modal = document.getElementById("pokedexModal");
    const pokedexListDiv = document.getElementById("pokedexList");
    const closeModalBtn = document.getElementById("closeModalBtn");

    // 儲存進度
    function saveProgress() {
        const caughtArray = Array.from(caughtSet);
        localStorage.setItem("taiwanMonsterCaught", JSON.stringify(caughtArray));
    }

    function loadProgress() {
        const saved = localStorage.getItem("taiwanMonsterCaught");
        if (saved) {
            const arr = JSON.parse(saved);
            caughtSet = new Set(arr.map(id => String(id)));
        } else {
            caughtSet.clear();
        }
        updateCatchCountUI();
    }

    function updateCatchCountUI() {
        catchNumberSpan.innerText = caughtSet.size;
    }

    function showMonsterIntro(monsterData) {
        alert(`✨ 抓到 ${monsterData.name} ✨\n\n${monsterData.desc}`);
    }

    function removeMonsterElement(element) {
        if (element && element.parentNode) element.remove();
        const index = currentMonsters.findIndex(m => m.element === element);
        if (index !== -1) currentMonsters.splice(index, 1);
    }

    function catchMonster(monsterId, monsterData, element) {
        if (caughtSet.has(monsterId)) {
            alert(`你再次遇見 ${monsterData.name}！但牠已經在圖鑑裡了～`);
            removeMonsterElement(element);
            return;
        }
        caughtSet.add(monsterId);
        saveProgress();
        updateCatchCountUI();
        showMonsterIntro(monsterData);
        removeMonsterElement(element);
    }

    function spawnRandomMonster() {
        if (!gameArea) return;
        const randomIndex = Math.floor(Math.random() * MONSTERS.length);
        const monster = MONSTERS[randomIndex];
        
        const maxX = Math.max(80, gameArea.clientWidth - 90);
        const maxY = Math.max(80, gameArea.clientHeight - 90);
        const x = 10 + Math.random() * maxX;
        const y = 10 + Math.random() * maxY;
        
        const btn = document.createElement("button");
        btn.className = "monster-btn";
        btn.style.left = x + "px";
        btn.style.top = y + "px";
        
        if (monster.image) {
            btn.innerHTML = `
                <img src="${monster.image}" style="width: 55px; height: 55px; object-fit: contain;" alt="${monster.name}">
                <div class="monster-name">${monster.name}</div>
            `;
        } else {
            btn.innerHTML = `
                <div>${monster.emoji}</div>
                <div class="monster-name">${monster.name}</div>
            `;
        }
        
        btn.addEventListener("click", (e) => {
            e.stopPropagation();
            catchMonster(monster.id, monster, btn);
        });
        
        gameArea.appendChild(btn);
        currentMonsters.push({ element: btn, monsterData: monster });
        
        setTimeout(() => {
            if (btn.parentNode) removeMonsterElement(btn);
        }, 40000);
    }

    function startSpawning() {
        if (spawnInterval) clearInterval(spawnInterval);
        spawnInterval = setInterval(() => {
            if (currentMonsters.length < 15) {
                spawnRandomMonster();
            }
        }, 2800);
    }

    // 圖鑑功能
    function renderPokedex() {
        if (!pokedexListDiv) return;
        pokedexListDiv.innerHTML = "";
        
        for (let monster of MONSTERS) {
            const isCaught = caughtSet.has(monster.id);
            const card = document.createElement("div");
            card.className = "pokedex-card";
            if (!isCaught) card.classList.add("uncaught");
            
            const avatarDiv = document.createElement("div");
            avatarDiv.className = "pokedex-avatar";
            
            if (isCaught) {
                if (monster.image) {
                    const img = document.createElement("img");
                    img.src = monster.image;
                    img.alt = monster.name;
                    avatarDiv.appendChild(img);
                } else {
                    avatarDiv.style.fontSize = "2.2rem";
                    avatarDiv.textContent = monster.emoji;
                }
            } else {
                const question = document.createElement("div");
                question.className = "question-mark";
                question.textContent = "?";
                avatarDiv.appendChild(question);
            }
            
            const nameSpan = document.createElement("div");
            nameSpan.className = "pokedex-name";
            nameSpan.textContent = monster.name;
            
            card.appendChild(avatarDiv);
            card.appendChild(nameSpan);
            
            if (isCaught) {
                card.addEventListener("click", (e) => {
                    e.stopPropagation();
                    showDetailModal(monster);
                });
            } else {
                card.addEventListener("click", () => {
                    alert(`你還沒遇過 ${monster.name}，再多逛逛吧！`);
                });
            }
            pokedexListDiv.appendChild(card);
        }
    }

    function showDetailModal(monster) {
        const detailHtml = `
            <div style="text-align:center; padding:8px;">
                <div style="font-size:4rem;">${monster.emoji}</div>
                <h3>${monster.name}</h3>
                <p style="background:#e5d5b0; border-radius:28px; padding:12px;">${monster.desc}</p>
                <button id="closeDetailBtn" style="background:#8b5a2b; border:none; color:white; padding:8px 24px; border-radius:40px;">關閉</button>
            </div>
        `;
        const modalDiv = document.createElement("div");
        modalDiv.style.position = "fixed";
        modalDiv.style.top = "0"; modalDiv.style.left = "0";
        modalDiv.style.width = "100%"; modalDiv.style.height = "100%";
        modalDiv.style.backgroundColor = "rgba(0,0,0,0.8)";
        modalDiv.style.display = "flex";
        modalDiv.style.alignItems = "center";
        modalDiv.style.justifyContent = "center";
        modalDiv.style.zIndex = "2000";
        modalDiv.style.backdropFilter = "blur(6px)";
        const card = document.createElement("div");
        card.style.backgroundColor = "#fff2e0";
        card.style.borderRadius = "48px";
        card.style.maxWidth = "300px";
        card.style.width = "80%";
        card.style.padding = "20px";
        card.innerHTML = detailHtml;
        modalDiv.appendChild(card);
        document.body.appendChild(modalDiv);
        
        const closeBtn = card.querySelector("#closeDetailBtn");
        closeBtn.addEventListener("click", () => {
            modalDiv.remove();
        });
        modalDiv.addEventListener("click", (e) => {
            if (e.target === modalDiv) modalDiv.remove();
        });
    }

    function resetProgress() {
        if (confirm("⚠️ 重置會清除所有捕捉紀錄，確定要重新開始嗎？")) {
            caughtSet.clear();
            saveProgress();
            updateCatchCountUI();
            for (let m of currentMonsters) {
                if (m.element && m.element.remove) m.element.remove();
            }
            currentMonsters = [];
            alert("遊戲進度已重置！妖怪們重新出現～");
        }
    }

    function openPokedex() {
        renderPokedex();
        modal.style.display = "flex";
    }

    function closeModal() {
        modal.style.display = "none";
    }

    function init() {
        loadProgress();
        startSpawning();
    }

    // 事件綁定
    openPokedexBtn.addEventListener("click", openPokedex);
    resetBtn.addEventListener("click", resetProgress);
    closeModalBtn.addEventListener("click", closeModal);
    if (igBtn) {
        igBtn.addEventListener("click", () => {
            // 請將下方網址換成你自己的 Instagram 個人檔案連結
            window.open("https://www.instagram.com/mongyao.2026/", "_blank");
        });
    }

    init();
</script>
</body>
</html>
